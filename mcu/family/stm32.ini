compiler = arm-none-eabi-gcc
cxx = arm-none-eabi-g++
objcopy = arm-none-eabi-objcopy
size = arm-none-eabi-size
output_ext = bin
objcopy_flags = -O binary
size_flags =

cpu =
fpu =
float_abi = soft
specs = --specs=nano.specs --specs=nosys.specs
arch_flags = -mcpu=$(CPU) -mthumb $(if $(FPU),-mfpu=$(FPU)) -mfloat-abi=$(FLOAT_ABI) $(SPECS)

cmsis_core =
cmsis_device =
device_define =
defines = -D$(DEVICE_DEFINE)
includes = -I$(CMSIS_CORE)/CMSIS/Core/Include -I$(CMSIS_DEVICE)/Include

startup =
system =
extra_sources = $(STARTUP) $(SYSTEM)

cflags = -Os -Wall -Wextra -ffunction-sections -fdata-sections
cppflags = -Os -Wall -Wextra -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti
asflags =
ldflags = -Wl,--gc-sections -Wl,--print-memory-usage
link_flags = -T$(LINKER_SCRIPT) -Wl,-Map=$(PROJECT_BUILD_DIR)/$(PROJECT_NAME).map

linker_template = stm32.ld.in
flash_origin = 0x08000000
flash_length =
ram_origin = 0x20000000
ram_length =
ccmram_origin = 0x10000000
ccmram_length =
min_heap_size = 0x200
min_stack_size = 0x400

require = cmsis_core cmsis_device cpu device_define startup flash_length ram_length

upload = st-flash

[upload.st-flash]
uploader = st-flash
upload_cmd = $(UPLOADER) --reset write $(TARGET) $(FLASH_ORIGIN)

[upload.openocd]
uploader = openocd
openocd_interface = stlink
openocd_target =
upload_cmd = $(UPLOADER) -f interface/$(OPENOCD_INTERFACE).cfg -f target/$(OPENOCD_TARGET).cfg -c "program $(ELF) verify reset exit"
require = openocd_target

[upload.stm32flash]
uploader = stm32flash
baud = 115200
port =
upload_cmd = $(UPLOADER) -b $(BAUD) -w $(TARGET) -v -g $(FLASH_ORIGIN) $(PORT)
require = port
