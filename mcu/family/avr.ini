compiler = avr-gcc
objcopy = avr-objcopy
size = avr-size
output_ext = hex
objcopy_flags = -O ihex -R .eeprom

arch_flags = -mmcu=$(MCU)
defines = -DF_CPU=$(MCU_FREQ)
includes =
cflags = -Os -Wall -Wextra -ffunction-sections -fdata-sections
cppflags = -Os -Wall -Wextra -ffunction-sections -fdata-sections
asflags =
ldflags = -Wl,--gc-sections -mrelax -lm
link_flags =
size_flags =

mcu_freq =
baud = 9600
avrdude_part = $(MCU)

require = mcu_freq

upload = avrdude

[upload.avrdude]
uploader = avrdude
programmer =
port =
upload_cmd = $(UPLOADER) -c $(PROGRAMMER) -p $(AVRDUDE_PART) -P $(PORT) -b $(BAUD) -U flash:w:$(TARGET):i
require = programmer port
